<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathfinding Lab</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e6edf3;
      letter-spacing: 0.04em;
    }

    .tag {
      font-size: 11px;
      background: #388bfd22;
      color: #58a6ff;
      border: 1px solid #388bfd55;
      border-radius: 4px;
      padding: 1px 7px;
    }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #161b22;
      border-right: 1px solid #21262d;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8b949e;
      margin-bottom: 4px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: #8b949e;
    }

    select, input[type="range"] {
      width: 100%;
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      outline: none;
    }

    select:focus { border-color: #388bfd; }

    input[type="range"] {
      padding: 2px 0;
      accent-color: #388bfd;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-row input { flex: 1; }
    .range-val {
      font-size: 11px;
      color: #8b949e;
      min-width: 40px;
      text-align: right;
    }

    .draw-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .draw-btn {
      padding: 5px 4px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: #c9d1d9;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .draw-btn:hover { background: #2d333b; }
    .draw-btn.active {
      background: #1c3a5c;
      border-color: #388bfd;
      color: #58a6ff;
    }

    .playback-btns {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover:not(:disabled) { background: #2d333b; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn.primary {
      background: #1c3a5c;
      border-color: #388bfd;
      color: #58a6ff;
    }

    .btn.primary:hover:not(:disabled) { background: #245077; }

    .btn.danger {
      background: #2d1a1a;
      border-color: #f8514955;
      color: #f85149;
    }

    .btn.danger:hover:not(:disabled) { background: #3d2020; }

    .full-btn {
      width: 100%;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .full-btn:hover { background: #2d333b; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      accent-color: #388bfd;
      width: 14px; height: 14px;
    }

    .checkbox-row label {
      font-size: 12px;
      color: #c9d1d9;
      cursor: pointer;
    }

    /* Stats */
    #stats {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 4px;
    }

    .stat span { color: #8b949e; font-size: 11px; }
    .stat strong { color: #e6edf3; font-size: 12px; }

    /* Legend */
    .legend { display: flex; flex-direction: column; gap: 4px; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #8b949e; }
    .legend-swatch {
      width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0;
    }

    /* Canvas area */
    #canvas-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      padding: 10px;
    }

    #pathfind-canvas {
      cursor: crosshair;
      display: block;
    }
  </style>
</head>
<body>

<header>
  <h1>Pathfinding Lab</h1>
  <span class="tag">A*</span>
  <span class="tag">Dijkstra</span>
  <span class="tag">Greedy BFS</span>
  <span class="tag">BFS</span>
</header>

<div id="main">
  <div id="sidebar">

    <!-- Algorithm -->
    <div class="control-group">
      <div class="section-title">Algorithm</div>
      <label for="algo-select">Search Algorithm</label>
      <select id="algo-select">
        <option value="astar">A* (A-Star)</option>
        <option value="dijkstra">Dijkstra</option>
        <option value="greedy">Greedy Best-First</option>
        <option value="bfs">BFS (Unweighted)</option>
      </select>

      <label for="heuristic-select">Heuristic</label>
      <select id="heuristic-select">
        <option value="manhattan">Manhattan</option>
        <option value="euclidean">Euclidean</option>
        <option value="chebyshev">Chebyshev</option>
      </select>

      <div class="checkbox-row">
        <input type="checkbox" id="diag-check" />
        <label for="diag-check">Allow Diagonal</label>
      </div>
    </div>

    <!-- Draw tools -->
    <div class="control-group">
      <div class="section-title">Draw Mode</div>
      <div class="draw-btns">
        <button class="draw-btn active" data-mode="wall">🧱 Wall</button>
        <button class="draw-btn" data-mode="weight">🌿 Weight</button>
        <button class="draw-btn" data-mode="erase">🧹 Erase</button>
        <button class="draw-btn" data-mode="start">🟢 Start</button>
        <button class="draw-btn" data-mode="goal">🔴 Goal</button>
      </div>
    </div>

    <!-- Playback -->
    <div class="control-group">
      <div class="section-title">Playback</div>
      <div class="playback-btns">
        <button class="btn primary" id="btn-play">▶ Play</button>
        <button class="btn" id="btn-pause">⏸ Pause</button>
        <button class="btn" id="btn-step">⏭ Step</button>
        <button class="btn danger" id="btn-reset">↺ Reset</button>
      </div>
    </div>

    <!-- Speed -->
    <div class="control-group">
      <div class="section-title">Speed</div>
      <div class="range-row">
        <input type="range" id="speed-slider" min="5" max="200" value="20" step="5" />
        <span class="range-val" id="speed-label">20ms</span>
      </div>
    </div>

    <!-- Grid -->
    <div class="control-group">
      <div class="section-title">Grid</div>
      <div class="range-row">
        <input type="range" id="size-slider" min="10" max="50" value="25" step="1" />
        <span class="range-val" id="size-label">25×40</span>
      </div>
      <button class="full-btn" id="btn-maze">⚡ Generate Maze</button>
      <button class="full-btn" id="btn-clear">✕ Clear Grid</button>
    </div>

    <!-- Stats -->
    <div class="control-group">
      <div class="section-title">Stats</div>
      <div id="stats"></div>
    </div>

    <!-- Legend -->
    <div class="control-group">
      <div class="section-title">Legend</div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-swatch" style="background:#3fb950"></div>Start
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:#f85149"></div>Goal
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:#58a6ff"></div>Wall
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:#e3b341"></div>Weight (5×)
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:#1c3a5c"></div>Visited
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:#388bfd"></div>Frontier
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:#ffa657"></div>Path
        </div>
      </div>
    </div>

  </div>

  <div id="canvas-wrap">
    <canvas id="pathfind-canvas"></canvas>
  </div>
</div>

<script src="bundlepathfind.js"></script>
</body>
</html>
