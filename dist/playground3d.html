<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Network Playground 3D</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Roboto", "Helvetica Neue", sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ââ Header ââ */
    header {
      background: #16213e;
      border-bottom: 1px solid #2a2a4a;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: #a0b4ff;
    }
    header .subtitle {
      font-size: 0.78rem;
      color: #6070a0;
    }

    /* ââ Main layout ââ */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ââ Controls sidebar ââ */
    .sidebar {
      width: 230px;
      flex-shrink: 0;
      background: #12122a;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #5a6a9a;
      margin-bottom: 6px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-row label {
      font-size: 0.75rem;
      color: #8090c0;
      display: flex;
      justify-content: space-between;
    }
    .control-row label span {
      color: #c0d0ff;
      font-weight: 500;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #2a3060;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #6080ff;
      cursor: pointer;
      transition: background 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { background: #8090ff; }

    select {
      width: 100%;
      background: #1e2040;
      border: 1px solid #3a3a6a;
      color: #c0d0ff;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: #6080ff; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: #8090c0;
      cursor: pointer;
    }
    input[type="checkbox"] {
      accent-color: #6080ff;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* ââ Action buttons ââ */
    .btn-group {
      display: flex;
      gap: 6px;
    }
    button {
      flex: 1;
      padding: 7px 4px;
      border: none;
      border-radius: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled { opacity: 0.35; cursor: default; }

    #btn-play  { background: #3a7a3a; color: #c0ffc0; }
    #btn-play:hover:not(:disabled) { background: #4a9a4a; }
    #btn-pause { background: #7a5a20; color: #ffe0a0; }
    #btn-pause:hover:not(:disabled) { background: #9a7020; }
    #btn-reset { background: #5a2a6a; color: #e0b0ff; }
    #btn-reset:hover { background: #7a3a8a; }

    /* ââ Stats ââ */
    .stats {
      background: #1a1a3a;
      border: 1px solid #2a2a5a;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
    }
    .stat-label { color: #6070a0; }
    .stat-value { color: #a0c0ff; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ââ Legend ââ */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.75rem;
      color: #8090c0;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-pos { background: #ff4d6d; }
    .dot-neg { background: #4d9fff; }
    .dot-boundary { background: linear-gradient(90deg, #ff4d6d, #4d9fff); border-radius: 2px; }

    /* ââ Canvas ââ */
    .canvas-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    #canvas-container canvas {
      display: block;
    }

    /* ââ Hint overlay ââ */
    .hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,10,30,0.7);
      color: #5060a0;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 12px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div style="padding:8px 14px;font-family:sans-serif;font-size:13px;"><a href="index.html" style="color:#0877bd;">← Back to Playground</a></div>

<header>
  <h1>Neural Network Playground 3D</h1>
  <span class="subtitle">Train a fully-connected net on 3D datasets Â· drag to rotate Â· scroll to zoom</span>
</header>

<div class="main">

  <!-- ââ Controls sidebar ââ -->
  <aside class="sidebar">

    <div>
      <div class="section-title">Actions</div>
      <div class="btn-group">
        <button id="btn-play">&#9654; Play</button>
        <button id="btn-pause" disabled>&#9646;&#9646; Pause</button>
        <button id="btn-reset">&#8635; Reset</button>
      </div>
    </div>

    <div>
      <div class="section-title">Stats</div>
      <div class="stats">
        <div class="stat-row">
          <span class="stat-label">Epoch</span>
          <span class="stat-value" id="epoch-value">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Loss</span>
          <span class="stat-value" id="loss-value">â</span>
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Dataset</div>
      <div class="control-group">
        <div class="control-row">
          <label>Shape</label>
          <select id="sel-dataset">
            <option value="blobs">Two Gaussian Blobs</option>
            <option value="spheres">Concentric Spheres</option>
            <option value="helix">Double Helix</option>
            <option value="swissroll">Swiss Roll</option>
          </select>
        </div>
        <div class="control-row">
          <label>Noise <span id="lbl-noise">0.10</span></label>
          <input type="range" id="slider-noise" min="0" max="0.5" step="0.01" value="0.10">
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Network</div>
      <div class="control-group">
        <div class="control-row">
          <label>Hidden neurons/layer <span id="lbl-hidden">6</span></label>
          <input type="range" id="slider-hidden" min="2" max="16" step="1" value="6">
        </div>
        <div class="control-row">
          <label>Learning rate <span id="lbl-lr">0.030</span></label>
          <input type="range" id="slider-lr" min="0.001" max="0.3" step="0.001" value="0.03">
        </div>
        <label class="checkbox-row">
          <input type="checkbox" id="chk-squared" checked>
          Add xÂ², yÂ², zÂ² features
        </label>
      </div>
    </div>

    <div>
      <div class="section-title">Legend</div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot dot-pos"></div>
          Class +1 (data points)
        </div>
        <div class="legend-item">
          <div class="legend-dot dot-neg"></div>
          Class â1 (data points)
        </div>
        <div class="legend-item">
          <div class="legend-dot dot-boundary" style="width:24px;height:6px;border-radius:3px;"></div>
          Decision boundary
        </div>
      </div>
    </div>

  </aside>

  <!-- ââ 3D Canvas ââ -->
  <div class="canvas-area">
    <div id="canvas-container"></div>
    <div class="hint">Drag to rotate &nbsp;Â·&nbsp; Scroll to zoom</div>
  </div>

</div>

<!-- Load three.js r168 from CDN (global THREE) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<!-- Our bundle (uses declare const THREE, no import from 'three') -->
<script src="bundle3d.js"></script>

</body>
</html>
