<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Armed Bandit Lab</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      color: #dde0f0;
      min-height: 100vh;
      padding: 18px 20px 40px;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: 4px;
      letter-spacing: 0.4px;
    }

    .subtitle {
      font-size: 0.83rem;
      color: #7777aa;
      margin-bottom: 18px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 20px;
      background: #15152a;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      align-items: flex-end;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 110px;
    }

    .ctrl-group label {
      font-size: 0.75rem;
      color: #9999bb;
      white-space: nowrap;
    }

    select, input[type=range] {
      font-family: inherit;
      font-size: 0.82rem;
      background: #1e1e35;
      color: #dde0f0;
      border: 1px solid #3a3a5a;
      border-radius: 5px;
      padding: 4px 6px;
      cursor: pointer;
      outline: none;
    }

    select:hover, select:focus {
      border-color: #7c6afa;
    }

    input[type=range] {
      padding: 0;
      width: 120px;
      accent-color: #a78bfa;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      font-family: inherit;
      font-size: 0.82rem;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: #6d5af5;
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { background: #8b7aff; }

    .btn-sec {
      background: #1e1e35;
      color: #b0b0d8;
      border: 1px solid #3a3a5a;
    }
    .btn-sec:hover { background: #2a2a4a; color: #dde0f0; }

    /* Info row */
    .info-row {
      font-size: 0.82rem;
      color: #8888aa;
      margin-bottom: 14px;
    }
    .info-row #step-count {
      color: #a78bfa;
      font-weight: 600;
    }

    /* Charts */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 14px;
    }

    .chart-svg {
      width: 100%;
      background: #12121f;
      border: 1px solid #22224a;
      border-radius: 8px;
      display: block;
    }

    .chart-tall { height: 260px; }
    .chart-med  { height: 220px; }

    #svg-arms {
      grid-column: 1 / 3;
    }

    @media (max-width: 700px) {
      .charts { grid-template-columns: 1fr; }
      #svg-arms { grid-column: 1; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="bundlebandit.js"></script>
</body>
</html>
