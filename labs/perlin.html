<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perlin Noise — NN Playground Labs</title>
  <style>
    :root { --bg:#0f1117; --panel:#1a1d27; --fg:#e6e6e6; --muted:#8a93a6; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
    header { padding:14px 18px; border-bottom:1px solid #262a36; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    header h1 { font-size:17px; margin:0; font-weight:600; }
    header a { color:var(--muted); text-decoration:none; font-size:13px; }
    header a:hover { color:var(--fg); }
    .wrap { display:flex; gap:18px; padding:18px; flex-wrap:wrap; }
    .panel { background:var(--panel); border:1px solid #262a36; border-radius:10px; padding:16px; width:240px; }
    .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 12px; }
    label { display:block; font-size:13px; margin:10px 0 4px; color:#c7cedb; }
    input[type=range], select { width:100%; }
    select { background:#262a36; color:var(--fg); border:1px solid #353b4a; border-radius:6px; padding:6px; }
    button { background:#262a36; color:var(--fg); border:1px solid #353b4a; border-radius:7px; padding:8px 12px; cursor:pointer; font-size:13px; margin-top:8px; }
    button:hover { background:#30364a; }
    .chk { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; }
    canvas { background:#0f1117; border:1px solid #262a36; border-radius:10px; max-width:100%; }
  </style>
</head>
<body>
  <header>
    <h1>🗺️ Perlin Noise &amp; fBm</h1>
    <a href="labs.html">← All labs</a>
    <a href="index.html">Main playground</a>
  </header>
  <div class="wrap">
    <div class="panel">
      <h2>Controls</h2>
      <label>Scale</label>
      <input type="range" id="pl-scale" min="4" max="40" step="1" value="12">
      <label>Octaves</label>
      <input type="range" id="pl-octaves" min="1" max="8" step="1" value="5">
      <label>Persistence</label>
      <input type="range" id="pl-persist" min="0.2" max="0.9" step="0.05" value="0.5">
      <label>Lacunarity</label>
      <input type="range" id="pl-lacun" min="1.5" max="3" step="0.1" value="2">
      <label>Palette</label>
      <select id="pl-palette">
        <option value="terrain">Terrain</option>
        <option value="gray">Grayscale</option>
        <option value="fire">Fire</option>
      </select>
      <button id="pl-reseed">Reseed</button>
      <label class="chk"><input type="checkbox" id="pl-animate"> Animate (scroll through noise)</label>
    </div>
    <canvas id="perlin-canvas" width="600" height="600"></canvas>
  </div>
  <script src="bundleperlin.js"></script>
</body>
</html>
