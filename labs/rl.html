<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RL Gridworld Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0f0;
      min-height: 100vh;
      padding: 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #a78bfa;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #8888aa;
      margin-bottom: 16px;
    }

    button {
      font-family: inherit;
    }

    select {
      font-family: inherit;
    }

    input[type=range] {
      cursor: pointer;
    }

    canvas {
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <h1>Reinforcement Learning — Gridworld Lab</h1>
  <p class="subtitle">
    Tabular Q-Learning &amp; SARSA on an editable gridworld. Click the grid to place walls, goals, pits, and the start cell.
    Train the agent and watch it learn a policy in real time.
  </p>
  <div id="app"></div>
  <script src="../dist/bundlerl.js"></script>
</body>
</html>
