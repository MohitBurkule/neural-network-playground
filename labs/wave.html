<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave Equation — NN Playground Labs</title>
  <style>
    :root { --bg:#0f1117; --panel:#1a1d27; --fg:#e6e6e6; --muted:#8a93a6; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
    header { padding:14px 18px; border-bottom:1px solid #262a36; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    header h1 { font-size:17px; margin:0; font-weight:600; }
    header a { color:var(--muted); text-decoration:none; font-size:13px; }
    header a:hover { color:var(--fg); }
    .wrap { display:flex; gap:18px; padding:18px; flex-wrap:wrap; }
    .panel { background:var(--panel); border:1px solid #262a36; border-radius:10px; padding:16px; width:240px; }
    .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 12px; }
    label { display:block; font-size:13px; margin:10px 0 4px; color:#c7cedb; }
    input[type=range], select { width:100%; }
    select { background:#262a36; color:var(--fg); border:1px solid #353b4a; border-radius:6px; padding:6px; }
    .row { display:flex; gap:8px; margin-top:8px; }
    button { background:#262a36; color:var(--fg); border:1px solid #353b4a; border-radius:7px; padding:8px 12px; cursor:pointer; font-size:13px; }
    button:hover { background:#30364a; }
    .hint { color:var(--muted); font-size:12px; margin-top:12px; }
    canvas { background:#0f1117; border:1px solid #262a36; border-radius:10px; max-width:100%; image-rendering:pixelated; }
  </style>
</head>
<body>
  <header>
    <h1>〰️ 2D Wave Equation</h1>
    <a href="labs.html">← All labs</a>
    <a href="index.html">Main playground</a>
  </header>
  <div class="wrap">
    <div class="panel">
      <h2>Controls</h2>
      <label>Mode</label>
      <select id="wave-mode">
        <option value="ripple">Ripple tank (draw)</option>
        <option value="doubleslit">Double slit (interference)</option>
      </select>
      <div class="row">
        <button id="wave-play">Pause</button>
        <button id="wave-reset">Reset</button>
      </div>
      <label>Sim speed</label>
      <input type="range" id="wave-speed" min="1" max="6" step="1" value="2">
      <label>Wave speed c</label>
      <input type="range" id="wave-c" min="0.1" max="0.7" step="0.05" value="0.5">
      <label>Damping</label>
      <input type="range" id="wave-damp" min="0" max="50" step="1" value="10">
      <div class="hint">Click &amp; drag on the canvas to create ripples. Try the double-slit mode to see interference fringes.</div>
    </div>
    <canvas id="wave-canvas" width="600" height="600"></canvas>
  </div>
  <script src="bundlewave.js"></script>
</body>
</html>
