name: CI

# Build the playground (main app + all labs) and run the unit tests on every
# push and pull request to the development branches. Keeps the branch green.
on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (main app + all labs)
        run: npm run build-all

      - name: Run unit tests
        run: npm test

      - name: Smoke-test labs (runtime init)
        run: npm run test:labs

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
